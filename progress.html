<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>學習進度查詢</title>
<style>
  :root{
    --bg:#F5F6FA; --card:#FFFFFF; --ink:#1E2761; --sub:#5B6280; --line:#DDE2EE;
    --full:#2E7D5B; --mid:#C98A1B; --low:#C2412D; --track:#EEF2FB; --accent:#1E2761;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11152A; --card:#1A2040; --ink:#E8ECFA; --sub:#A3AACB; --line:#2C3460;
      --full:#4FB98A; --mid:#E0A63A; --low:#E2674F; --track:#232B52; --accent:#CADCFC;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC","Source Han Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
  .wrap{max-width:980px;margin:0 auto;padding:24px 16px 48px}
  header h1{font-size:1.35rem;margin:0}
  header p{margin:4px 0 0;color:var(--sub);font-size:.9rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:18px}
  .login{max-width:420px}
  .tabs-unused{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{flex:1;padding:8px;border:1px solid var(--line);background:transparent;color:var(--sub);
    border-radius:8px;cursor:pointer;font:inherit}
  .tabs button.on{background:var(--accent);color:var(--card);border-color:var(--accent)}
  label{display:block;font-size:.85rem;color:var(--sub);margin:10px 0 4px}
  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;
    background:var(--bg);color:var(--ink)}
  .go{margin-top:14px;width:100%;padding:11px;border:0;border-radius:8px;background:var(--accent);
    color:var(--card);font:inherit;font-weight:700;cursor:pointer}
  .err{color:var(--low);font-size:.85rem;min-height:1.2em;margin-top:8px}
  .hidden{display:none}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .top h2{margin:0;font-size:1.15rem}
  .top .meta{color:var(--sub);font-size:.85rem}
  .out{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;
    color:var(--sub);cursor:pointer;font:inherit;font-size:.85rem}
  .big{font-size:2rem;font-weight:800}
  /* 直條圖 */
  .chart{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;align-items:end;
    height:var(--h,240px);margin-top:16px;border-bottom:1px solid var(--line);padding-top:22px}
  .col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
  .val{font-size:.8rem;font-weight:700;margin-bottom:3px;white-space:nowrap}
  .bar{width:70%;max-width:56px;border-radius:6px 6px 0 0;min-height:2px}
  .xl{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;margin-top:6px;text-align:center}
  .xl div{font-size:.75rem;color:var(--sub)}
  .xl b{display:block;color:var(--ink);font-size:.8rem}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--sub);margin-top:12px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  /* 教師端小圖 */
  .tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .tools input,.tools select{width:auto;flex:1;min-width:160px}
  select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:14px}
  .mini{border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px}
  .mini .hd{display:flex;justify-content:space-between;font-size:.9rem}
  .mini .hd span{color:var(--sub);font-size:.8rem}
  .mini .chart{--h:130px;gap:4px;padding-top:18px;margin-top:6px}
  .mini .val{font-size:.62rem}
  .mini .xl{gap:4px}
  .mini .xl div{font-size:.62rem}
  .note{color:var(--sub);font-size:.8rem;margin-top:14px}
  @media (max-width:560px){
    .chart{gap:4px}.xl{gap:4px}.val{font-size:.66rem}.xl b{font-size:.7rem}.xl div{font-size:.62rem}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p style="margin:0 0 6px"><a href="index.html" style="color:var(--sub);font-size:.85rem">← 回講義首頁</a></p>
    <h1>互動媒體製作｜第 1–<span data-wk>9</span> 週學習完成度</h1>
    <p>115-1 進修四技多遊四甲　<span id="asof"></span></p>
  </header>

  <!-- 登入 -->
  <section class="card login" id="loginBox">
    <form id="fS">
      <label for="sid">請輸入學號</label>
      <input id="sid" type="password" autocomplete="off" placeholder="例：H1125xxx" required>
      <button class="go">查詢我的進度</button>
    </form>
    <div class="err" id="err"></div>
  </section>

  <!-- 學生結果 -->
  <section class="card hidden" id="stuBox">
    <div class="top">
      <div><h2 id="stuName"></h2><div class="meta">第 1–<span data-wk>9</span> 週平均完成度 <span class="big" id="stuAvg"></span></div></div>
      <button class="out" type="button" data-out>登出</button>
    </div>
    <div id="stuChart"></div>
    <div class="legend">
      <span><i style="background:var(--full)"></i>100%　已完成</span>
      <span><i style="background:var(--mid)"></i>50–99%　部分完成</span>
      <span><i style="background:var(--low)"></i>0–49%　待補進度</span>
    </div>
    <p class="note">百分比為創課平台各週「閱讀／完成」數據；未達 100% 的週次，請回創課平台補看影片與完成活動。</p>
  </section>

  <!-- 教師結果 -->
  <section class="hidden" id="tchBox">
    <div class="card">
      <div class="top">
        <div><h2>全班各週平均完成度</h2><div class="meta" id="tchMeta"></div></div>
        <button class="out" type="button" data-out>登出</button>
      </div>
      <div id="avgChart"></div>
    </div>
    <div class="card">
      <div class="top"><h2>個別學生</h2></div>
      <div class="tools">
        <input id="q" placeholder="搜尋姓名或學號">
        <select id="sort">
          <option value="avg-desc">平均完成度：高 → 低</option>
          <option value="avg-asc">平均完成度：低 → 高</option>
          <option value="id">學號</option>
        </select>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>
</div>

const WEEK_TITLES = ["AI專案企劃","助教Agent","HTML基礎","HTML實作","CSS選擇器","UI/UX","Google Site","多媒體整合","期中檢核"];
const $ = s => document.querySelector(s);
const enc = new TextEncoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

// 以 PBKDF2 衍生金鑰並以 AES-GCM 解密；密碼錯誤時會丟出例外
async function decrypt(secret, rec){
  const base = await crypto.subtle.importKey("raw", enc.encode(secret), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(rec.s), iterations:DATA.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(rec.i)}, key, b64(rec.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function sha256hex(s){
  const h = await crypto.subtle.digest("SHA-256", enc.encode(s));
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2,"0")).join("");
}

const color = v => v >= 100 ? "var(--full)" : v >= 50 ? "var(--mid)" : "var(--low)";
const avg = a => Math.round(a.reduce((x,y)=>x+y,0) / a.length * 10) / 10;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 直條圖：每根長條上方標示百分比
function barChart(vals, {mini=false} = {}){
  const n = vals.length;
  const cols = vals.map(v => `<div class="col"><div class="val">${v}%</div>
      <div class="bar" style="height:${Math.max(v,0.8)}%;background:${color(v)}"></div></div>`).join("");
  const xl = vals.map((_,i) => mini ? `<div>W${i+1}</div>` :
      `<div><b>W${i+1}</b>${WEEK_TITLES[i]||""}</div>`).join("");
  return `<div class="chart" style="--n:${n}" role="img" aria-label="第1到${n}週完成度：${vals.map((v,i)=>`第${i+1}週${v}%`).join("，")}">${cols}</div>
          <div class="xl" style="--n:${n}">${xl}</div>`;
}

function show(id){
  ["#loginBox","#stuBox","#tchBox"].forEach(s => $(s).classList.toggle("hidden", s !== id));
}
$("#asof").textContent = "資料截至 " + DATA.asof;
document.querySelectorAll("[data-wk]").forEach(el => el.textContent = DATA.weeks);

// 單一入口：先比對學號；查無學號時，再嘗試以教師帳號解開全班資料
let CLASS = [];
const NOT_FOUND = "查無此學號，請確認輸入是否正確。";
$("#fS").onsubmit = async e => {
  e.preventDefault();
  const raw = $("#sid").value.trim(), id = raw.toUpperCase();
  $("#err").textContent = "查詢中…";
  const rec = DATA.r[await sha256hex("hk1151|" + id)];
  try{
    if(rec){                                   // 學生：學號即金鑰
      const d = await decrypt(id, rec);
      $("#stuName").textContent = d.name + " 的學習進度";
      $("#stuAvg").textContent = avg(d.w) + "%";
      $("#stuChart").innerHTML = barChart(d.w);
      show("#stuBox");
    }else{                                     // 教師：帳號即金鑰，解不開即視為查無
      CLASS = await decrypt("teacher|" + raw.toLowerCase(), DATA.t);
      CLASS.forEach(s => s.avg = avg(s.w));
      const weekAvg = [...Array(DATA.weeks)].map((_,i) => avg(CLASS.map(s => s.w[i])));
      $("#avgChart").innerHTML = barChart(weekAvg);
      $("#tchMeta").textContent = `共 ${CLASS.length} 位學生｜第 1–${DATA.weeks} 週全班平均 ${avg(weekAvg)}%`;
      renderGrid();
      show("#tchBox");
    }
    $("#err").textContent = ""; $("#sid").value = "";
  }catch{ $("#err").textContent = NOT_FOUND; }
};

function renderGrid(){
  const q = $("#q").value.trim().toUpperCase(), mode = $("#sort").value;
  let list = CLASS.filter(s => !q || s.id.includes(q) || s.name.toUpperCase().includes(q));
  list.sort(mode==="id" ? (a,b)=>a.id.localeCompare(b.id)
          : mode==="avg-asc" ? (a,b)=>a.avg-b.avg : (a,b)=>b.avg-a.avg);
  $("#grid").innerHTML = list.map(s => `<div class="mini">
      <div class="hd"><b>${esc(s.name)}</b><span>${esc(s.id)}｜平均 ${s.avg}%</span></div>
      ${barChart(s.w,{mini:true})}</div>`).join("") || `<p class="note">沒有符合的學生。</p>`;
}
$("#q").oninput = renderGrid;
$("#sort").onchange = renderGrid;

document.querySelectorAll("[data-out]").forEach(b => b.onclick = () => { CLASS = []; show("#loginBox"); });
</script>
</body>
